name: CI Usage Report Validation

on:
  pull_request:
    paths:
      - '.github/actions/ci-usage-report/**'
      - '.github/workflows/ci-usage-report-validation.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/ci-usage-report/**'
      - '.github/workflows/ci-usage-report-validation.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test The Usage Reporter Offline
        run: node --test .github/actions/ci-usage-report/test/report.node-test.mjs
