# Fleet /tmp hygiene for the symdb-pids marker files from OPS-1003.
# Not installed. Copying this into systemd-tmpfiles and running --clean
# waits for Jay. Do not point it at box-disk-hygiene.
#
# systemd-tmpfiles ages by timestamp and skips a path that already holds a
# BSD flock. It cannot test file size or /proc. Removal lines therefore name
# only the marker globs and one known curl dump. x lines keep sockets, lock
# files, *.pid names, the X11 socket dir, systemd private dirs, and /tmp/ctdb
# (the multi-gigabyte sqlite tree from the same alert) out of cleanup.
# scripts/ops/tmp-hygiene-policy.mjs is the stricter zero-byte and live-PID
# rule the tests enforce on top of these globs.

x /tmp/*.socket - - - - -
x /tmp/*.lock - - - - -
x /tmp/*.pid - - - - -
x /tmp/symdb-pids/*.socket - - - - -
x /tmp/symdb-pids/*.lock - - - - -
x /tmp/symdb-pids/*.pid - - - - -
x /tmp/.X11-unix - - - - -
x /tmp/.X[0-9]*-lock - - - - -
x /tmp/systemd-private-* - - - - -
x /tmp/ctdb - - - - -

r /tmp/symdb-pids/[0-9]* - - - 7d -
r /tmp/symdb-pids/*-symdb-pids - - - 7d -
r /tmp/*-symdb-pids - - - 7d -
r /tmp/ct-coolify-restart.out - - - 1d -
