<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="8">
<title>Congress.Trade — updating</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff; color: #14181f; padding: 24px;
  }
  main { max-width: 30rem; text-align: center; }
  h1 { font-size: 1.25rem; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 0.5rem; }
  p { margin: 0; color: #5b6472; }
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #2f6fed; margin-right: 0.55rem; vertical-align: 0.05em;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    p { color: #9aa4b2; }
  }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<main>
  <h1><span class="dot" aria-hidden="true"></span>Congress.Trade is updating</h1>
  <p>A new version is starting up.&nbsp; This page refreshes itself, so there is nothing to do but wait a few seconds.</p>
</main>
</body>
</html>
