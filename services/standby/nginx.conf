# congress.trade standby ("holding page") server.
#
# Mounted at /etc/nginx/conf.d/default.conf inside a plain `nginx:alpine`
# container that ct-standby.service runs OUTSIDE the Coolify project, so a
# Coolify deploy — which stops and removes every container in the project
# before starting the new ones — cannot take it down.
#
# Traefik only sends traffic here when the real backend's health check is
# failing (see the `failover` service written by ct-reattach-proxy.sh), which in
# practice means the seconds between Coolify removing the old app container and
# the new one answering /health.
#
# Everything answers 503 on purpose.  A 200 here would tell UptimeRobot and
# congress-health-recover.sh that the site is fine while it is actually mid
# deploy, and would let search engines cache the holding page as real content.
# 503 + Retry-After is the correct "come back shortly" signal for all three.
server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    error_page 503 /standby.html;

    add_header Retry-After 15 always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    location = /standby.html {
        internal;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        return 503;
    }
}
