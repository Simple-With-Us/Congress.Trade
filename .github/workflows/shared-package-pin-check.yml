name: Shared Package Pin Check

on:
  pull_request:
    paths:
      - 'app/vendor/congress-trading-shared/**'
      - 'deno.json'
      - 'app/deno.json'
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  pin-check:
    name: Verify vendored shared package matches tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Resolve vendored version
        id: vendored
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app/vendor/congress-trading-shared/package.json').version")
          if [[ -z "$VERSION" || "$VERSION" == "undefined" ]]; then
            echo "::error::Could not read version from app/vendor/congress-trading-shared/package.json"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Vendored version: v${VERSION}"

      - name: Check out upstream tagged release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: jaywedgeworth22/congress-trading-shared
          ref: v${{ steps.vendored.outputs.version }}
          path: .upstream-shared
          persist-credentials: false

      - name: Compare vendored source with tagged release
        shell: bash
        env:
          TAG: v${{ steps.vendored.outputs.version }}
        run: |
          set -euo pipefail
          VENDOR_SRC="app/vendor/congress-trading-shared/src"
          UPSTREAM_SRC=".upstream-shared/src"
          APPROVED="app/vendor/congress-trading-shared/APPROVED-DRIFT.patch"

          UPSTREAM_SHA=$(git -C .upstream-shared rev-parse HEAD)
          echo "Upstream ${TAG} resolves to commit ${UPSTREAM_SHA}"

          if [[ ! -d "$UPSTREAM_SRC" ]]; then
            echo "::error::Upstream ${TAG} has no src/ directory"
            exit 1
          fi

          if [[ ! -d "$VENDOR_SRC" ]]; then
            echo "::error::Vendored source directory ${VENDOR_SRC} is missing"
            exit 1
          fi

          ACTUAL="${RUNNER_TEMP}/pin-drift.patch"
          # `git diff --no-index` exits 0 (identical), 1 (differs), or >1 (error).
          # A blanket `|| true` swallowed the error case too, so a missing or
          # renamed source tree produced an empty patch and the check reported
          # "byte-identical" and PASSED — the exact no-op this gate exists to
          # prevent. Tolerate 0 and 1 only.
          set +e
          git --no-pager diff --no-index --no-color --full-index \
            --src-prefix=upstream/ --dst-prefix=vendored/ \
            -- "$UPSTREAM_SRC" "$VENDOR_SRC" > "$ACTUAL"
          DIFF_STATUS=$?
          set -e
          if [[ "$DIFF_STATUS" -gt 1 ]]; then
            echo "::error::git diff failed (exit ${DIFF_STATUS}); cannot verify the pin"
            exit 1
          fi

          if [[ ! -s "$ACTUAL" ]]; then
            echo "::notice::Vendored source is byte-identical to ${TAG} (${UPSTREAM_SHA})"
            exit 0
          fi

          if [[ -f "$APPROVED" ]] && diff -q "$APPROVED" "$ACTUAL" >/dev/null; then
            echo "::notice::Vendored source differs from ${TAG} only by the reviewed patch in ${APPROVED}"
            exit 0
          fi

          echo "::error::Vendored source drifted from upstream ${TAG} (${UPSTREAM_SHA}) beyond the reviewed patch in ${APPROVED}"
          echo "----- actual diff (upstream -> vendored) -----"
          cat "$ACTUAL"
          echo "----------------------------------------------"
          exit 1
