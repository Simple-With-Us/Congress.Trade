name: docker-reclaim

# Offline planner tests. A separate workflow so this does not edit ci.yml,
# which other host-hygiene PRs are already changing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-reclaim-tests:
    name: docker reclaim (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Docker reclaim planner tests
        run: bash scripts/ops/test-docker-reclaim.sh
