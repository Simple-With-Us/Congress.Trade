name: Deploy Coolify (Congress.Trade)

# Primary path: Coolify GitHub webhook auto-deploy on push to main
# (is_auto_deploy_enabled + webhooks/source/github/events/manual).
# This workflow is a manual/API safety net only — no SSH into the host.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force rebuild
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Queue Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_AGENTS }}
          COOLIFY_UUID: congress-trade
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "::error::COOLIFY_AGENTS secret missing (full-permission Coolify token; not the read-only server-stats token). Auto-deploy still works via Coolify webhook on push to main."
            exit 1
          fi
          force_q=""
          if [ "${FORCE}" = "true" ]; then force_q="&force=true"; fi
          code=$(curl -sS -o /tmp/coolify-deploy.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            "https://host.jays.services/api/v1/deploy?uuid=${COOLIFY_UUID}${force_q}")
          echo "HTTP ${code}"
          cat /tmp/coolify-deploy.json
          test "$code" = "200" -o "$code" = "201"
