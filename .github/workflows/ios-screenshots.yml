name: iOS screenshots (Mac runner)

# App Store screenshot capture.  Runs a throwaway UI test on simulators with a
# StoreKit test config that mirrors production (monthly 8.99, annual 79.99,
# 1-week free trial), then uploads the PNGs as an artifact.  Never uploads to
# App Store Connect.  See scripts/ios-screenshots/run.sh.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios-screenshots.yml'
      - 'scripts/ios-screenshots/**'

permissions:
  contents: read

concurrency:
  group: ios-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: capture screenshots
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      SHOT_OUT: ${{ github.workspace }}/shots-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assert stable Xcode (never beta)
        run: bash scripts/ios-assert-stable-xcode.sh

      - name: Capture
        run: bash scripts/ios-screenshots/run.sh

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: congress-trade-ios-screenshots
          path: shots-out/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload result bundles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: congress-trade-ios-screenshots-xcresult
          path: shots-out/*.xcresult
          if-no-files-found: warn
          retention-days: 7
