name: Sentry CI Report

# Fleet-wide CI observability: receives completion events from the observed
# workflows, but only reserves a runner for failures or scheduled check-ins.
# It reports those actionable events to the shared `fleet-infra` Sentry project
# (org simple-with-us). ADDITIVE ONLY — this file must never modify the behavior
# of the workflows it observes.
#
# Two independent signals per completed run:
#   1. On conclusion == failure: a Sentry error event, tagged with
#      {app, workflow, branch, actor}, carrying the run URL, fingerprinted on
#      [app, workflow] so every failure of one workflow groups into ONE Sentry
#      issue instead of paging separately every time. The branch is a TAG only,
#      never a fingerprint component (it was until 2026-08-12, which minted a
#      permanent issue per feature branch — ~85 of the fleet's unresolved
#      fleet-infra issues). The `app` tag +
#      fingerprint component are REQUIRED here (not in the Socratic.Trade
#      copy): the fleet-infra project is shared across repos, and this repo
#      shares workflow names ("CI", "Deploy", "Security") with Socratic.Trade,
#      so without `app` a "CI" failure here would dedup into the same Sentry
#      issue as a "CI" failure there. See AGENT-SYNC.md "Observability".
#   2. On event == schedule (i.e. the completed run was a cron-triggered
#      run of a workflow that defines `schedule:`): a Sentry Crons check-in
#      (ok on success, error on failure) with an upsert monitor_config whose
#      schedule mirrors that workflow's own cron expression, slug
#      `ci-<workflow-slug>`. This means a nightly/weekly job that silently
#      STOPS firing (not "runs and fails" but "never runs again") raises a
#      missed-check-in alert instead of going unnoticed.
#
# Raw Sentry envelope HTTP via curl + python3 (both available on the Coolify
# CI runner) — no action marketplace dependency, no new job permissions
# beyond what's needed to read the triggering run.
#
# workflows observed (from `ls .github/workflows/` at authoring time — see
# the `name:` header of each file):
#   CI, Deploy Coolify (Congress.Trade), Admin Maintenance,
#   Effort Issues Sync, Shared Package Pin Check, Security
#
# DELIBERATELY NOT observed:
#   - Sentry CI Report (this file) — would recurse.
#   - Uptime Monitor — it runs every 5 minutes (`*/5 * * * *`); observing it
#     via workflow_run would fan out to ~288 reporter runs/day (~2880 Actions
#     minutes/month, over the free budget), and a 15-minute check-in margin
#     does not fit a 5-minute schedule. If you want failure coverage for it,
#     add "Uptime Monitor" below AND a right-sized entry to CRON_SCHEDULES in
#     scripts/sentry-ci-report.py (margin/runtime tuned for a 5-min cadence).
#
# Cron schedules mirrored for the check-in step (must match the source
# workflow's `schedule:` block AND its `name:`; keep in sync if those change).
# The reporter validates these keys against the real workflow names on every
# run and raises a Sentry issue on drift, so a rename cannot silently kill a
# monitor the way "Shared package pin check" did between 2026-07-27 and
# 2026-08-12:
#   CI                       -> "23 * * * *"  (ci.yml, hourly backstop tick)
#   Effort Issues Sync       -> "12 6 * * *"  (effort-issues-sync.yml, daily)
#   Security                 -> "41 10 * * 1" (security.yml, Mondays)
#   Shared Package Pin Check -> "0 13 * * 1"  (shared-package-pin-check.yml, Mondays)

on:
  workflow_run:
    workflows:
      # Names must match the `name:` field of workflow files exactly —
      # a stale entry here silently disables alerting for that pipeline.
      # 2026-07-30: "Deploy Deno" + "Deploy Preview" removed — Deno Deploy is
      # retired (owner: Oracle/Coolify only); both workflows were deleted.
      # "Deploy Oracle Monolith" renamed to match deploy-oracle.yml.
      - CI
      - Deploy Coolify (Congress.Trade)
      - Admin Maintenance
      - Effort Issues Sync
      - Shared Package Pin Check
      - Security
      - Sentry Deploy
    types: [requested, completed]

permissions:
  contents: read

concurrency:
  group: sentry-ci-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  # The script has no side effect for an ordinary successful push/PR/manual
  # run. Gate those events before runner scheduling so observability cannot
  # starve the single CI runner with guaranteed no-op jobs. Keep this list in
  # lockstep with ALERT_CONCLUSIONS in scripts/sentry-ci-report.py. Every
  # scheduled run remains eligible because Sentry Crons needs both success and
  # error check-ins.
  report:
    if: >-
      (github.event.action == 'requested' && github.event.workflow_run.event == 'schedule') ||
      (github.event.action == 'completed' && (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure' ||
      github.event.workflow_run.event == 'schedule'))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (for the reporter script only; does not touch observed workflows)
        # Deliberately no `ref:` override: actions/checkout defaults workflow_run events to the
        # repo's default branch (main), NOT the head ref of the triggering run. That's intentional
        # here — it means this step always executes the trusted, merged copy of the reporter
        # script rather than whatever version lives on an arbitrary (possibly fork/PR) branch that
        # triggered the observed workflow. Do not add `ref: ${{ github.event.workflow_run.head_sha }}`
        # without re-reviewing the security implications.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Report failure + cron check-in to Sentry fleet-infra
        shell: bash
        env:
          SENTRY_FLEET_DSN: ${{ secrets.SENTRY_FLEET_DSN }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ACTION: ${{ github.event.action }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python3 scripts/sentry-ci-report.py
