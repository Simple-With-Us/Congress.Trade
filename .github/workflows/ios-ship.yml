name: iOS TestFlight ship (Mac runner)

# Archive + upload on the owned Mac runner so TestFlight (the phone) actually
# updates when iOS code lands on main. Unsigned compile stays in ios-build.yml.
#
# XCODE BUILDS ONLY (owner 2026-08-12): this workflow may target mac-runner
# labels. Backend jobs stay off this host. Fork PRs never run here.
#
# Signing material from Infisical prod; identity on GitHub only.
#
# WHY THERE IS A `schedule:` TRIGGER (2026-08-13)
# ----------------------------------------------
# `push:` alone is not a reliable trigger on this repo. A PR merged by
# github-actions[bot] (auto-merge armed with GITHUB_TOKEN) lands on main under
# GitHub's recursion guard and dispatches NOTHING. Measured: PR #1835
# (bot-merged, sha c38b6787, touches clients/ios) produced zero runs; PR #1836
# (human-merged, sha ceaca097) produced five. So iOS code could reach main and
# never reach a phone. `schedule:` events are exempt from the recursion guard,
# so the cron notices what the push never announced. Socratic.Trade has run the
# same cron since 2026-08-13; ours is offset so the three fleet repos do not
# contend for the single Mac runner at the same minute.
#
# NOT EVERY RUN SHIPS -- and the scheduled path is guarded twice.
#   1. The "scheduled ship gate" step below refuses to even try unless
#      clients/ios/** actually changed between the last successful ship's sha
#      and HEAD. Cron carries no `paths:` filter of its own, so without this a
#      backend-only commit would ship a TestFlight build. The owner does not
#      want TestFlight spammed; this is the guard that prevents it.
#   2. The ship script itself then rate-limits successful uploads to one per app
#      per DEFAULT_MIN_INTERVAL_SEC=3600 seconds (1 hour), a constant near
#      the top of scripts/ios-fleet/ship-testflight.sh, and independently skips
#      when git HEAD already shipped. Runs inside that window print
#      "ship-gate: skip" and exit 0 (green, nothing uploaded).
# Neither kind of skip consumes a build number.
# Hosted macos-latest runners have an empty home each job.  This repo forbids
# actions/cache (check-actions-runner-policy.mjs), so last-ship state cannot
# persist.  Treating that empty home as "never shipped" re-archived every
# cron tick (measured: 1.0.222 on 2026-09-04 from schedule, no iOS change).
# A scheduled tick with no last-ship file now skips.  Real ships are a push
# that passed paths: or an explicit workflow_dispatch.  To force one run,
# dispatch the workflow or run the wrapper locally with --force-ship.

on:
  push:
    branches: [main]
    paths:
      - 'clients/ios/**'
      - '.github/workflows/ios-ship.yml'
  workflow_dispatch:
  schedule:
    # Twice an hour, offset from Socratic.Trade's '*/30' so the shared Mac
    # runner is not asked to start three fleet ships on the same minute.
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: ios-ship-congress
  cancel-in-progress: false

jobs:
  ship:
    name: TestFlight archive + upload
    if: github.event.repository.fork == false
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The scheduled gate diffs HEAD against the sha recorded by the last
          # successful ship, which can be many commits back. Default depth-1
          # would make that range uncomputable ("unknown revision") and the
          # gate would degrade to skipping every tick.
          fetch-depth: 0

      # Runs FIRST so a tick with nothing to ship costs seconds and cannot go
      # red on an unrelated environment problem.
      # Logic lives in a script, not inline YAML, so it can be syntax-checked
      # and unit-tested by CI (ios-fleet-ship-logic job) on every PR instead of
      # only being exercised on the one Mac that can ship.
      - name: Scheduled ship gate (skip unless iOS code changed)
        id: gate
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ios-fleet/scheduled-ship-gate.sh" \
            --event "${{ github.event_name }}" \
            --path-prefix 'clients/ios/' \
            --repo-root "$GITHUB_WORKSPACE" \
            congress

      - name: Assert stable Xcode (never beta)
        if: steps.gate.outputs.should_ship == '1'
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          ver=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "Xcode version: ${ver}"
          case "$DEVELOPER_DIR" in
            *[Bb]eta*)
              echo "::error::DEVELOPER_DIR resolves to a beta Xcode: $DEVELOPER_DIR"
              exit 1
              ;;
          esac

      # Do not use `secrets.*` in `if:` -- GitHub's dispatch parser rejects
      # that named-value (HTTP 422: Unrecognized named-value: 'secrets') and
      # the whole workflow dies at 0s with 0 jobs.  Same class as DealDex #175
      # and Usage-Monitor #1343. Check ASC_KEY_ID from step env after mapping.

      # Identity stays on GitHub.  Apple/iOS signing material comes from Infisical prod.
      - name: Load Infisical signing secrets
        if: steps.gate.outputs.should_ship == '1'
        env:
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set +o xtrace
          set -euo pipefail
          export INFISICAL_DISABLE_UPDATE_CHECK=true

          if ! command -v infisical >/dev/null 2>&1; then
            NONINTERACTIVE=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install infisical/get-cli/infisical
          fi
          command -v infisical >/dev/null 2>&1 || {
            echo "::error::Infisical CLI is not installed."
            exit 1
          }

          if [ -z "${INFISICAL_PROJECT_ID}" ]; then
            echo "::error::Missing INFISICAL_PROJECT_ID GitHub secret."
            exit 1
          fi
          CLIENT_ID="${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}"
          CLIENT_SECRET="${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}"
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            CLIENT_ID="${INFISICAL_CLIENT_ID}"
            CLIENT_SECRET="${INFISICAL_CLIENT_SECRET}"
          fi
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Missing Infisical machine identity.  Set INFISICAL_UNIVERSAL_AUTH_CLIENT_ID/SECRET (fallback INFISICAL_CLIENT_ID/SECRET) on the repo."
            exit 1
          fi

          TOKEN="$(
            env -u INFISICAL_CLIENT_ID -u INFISICAL_CLIENT_SECRET -u INFISICAL_TOKEN \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_ID="$CLIENT_ID" \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET="$CLIENT_SECRET" \
              infisical login --method=universal-auth --silent --plain --telemetry=false 2>/dev/null || true
          )"
          if [ -z "$TOKEN" ]; then
            echo "::error::Infisical universal-auth login failed."
            exit 1
          fi
          if [[ "$TOKEN" == *$'\n'* || "$TOKEN" == *$'\r'* ]]; then
            echo '::error::Infisical returned a multiline token.' >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "${TOKEN//'%'/'%25'}"

          for name in ASC_KEY_ID ASC_ISSUER_ID SENTRY_DSN \
                      IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD; do
            val="$(
              INFISICAL_TOKEN="$TOKEN" infisical secrets get "$name" \
                --plain --silent --telemetry=false --expand=false \
                --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/ \
                2>/dev/null || true
            )"
            if [ -z "$val" ]; then
              continue
            fi
            if [[ "$val" == *$'\n'* || "$val" == *$'\r'* ]]; then
              echo "::error::Signing field $name must be single-line; correct Infisical formatting." >&2
              exit 1
            fi
            printf '::add-mask::%s\n' "${val//'%'/'%25'}"
            printf -v "$name" '%s' "$val"
            export "$name"
            # Certificate credentials belong only to this load/import step.
            if [[ "$name" == ASC_KEY_ID || "$name" == ASC_ISSUER_ID || "$name" == SENTRY_DSN ]]; then
              printf '%s=%s\n' "$name" "$val" >> "$GITHUB_ENV"
            fi
          done
          # Keep multiline PEM out of GITHUB_ENV and every later step environment.
          # Only its mode-600 file path crosses the step boundary.
          key_material="$(
            INFISICAL_TOKEN="$TOKEN" infisical secrets get ASC_KEY_P8 \
              --plain --silent --telemetry=false --expand=false \
              --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/ \
              2>/dev/null || true
          )"
          if [ -z "$key_material" ]; then
            echo "::error::Missing ASC key material in Infisical prod."
            exit 1
          fi
          printf '%s\n' "$key_material" | bash "$GITHUB_WORKSPACE/scripts/ios-stage-asc-key.sh"
          ASC_KEY_PATH="$(sed -n 's/^ASC_KEY_PATH=//p' "$GITHUB_ENV" | tail -n 1)"
          export ASC_KEY_PATH
          bash "$GITHUB_WORKSPACE/scripts/ios-appstore-gm-prepare.sh"
          unset key_material TOKEN CLIENT_ID CLIENT_SECRET val IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD

      - name: Report runtime ios-fleet drift (advisory)
        if: steps.gate.outputs.should_ship == '1'
        run: |
          set -uo pipefail
          if out="$(bash "$GITHUB_WORKSPACE/scripts/ios-fleet/check-drift.sh" 2>&1)"; then
            echo "$out"
            exit 0
          fi
          echo "$out"
          echo "::warning::The runtime ios-fleet copy (/Users/jay/apps/ios-fleet) has drifted from this repo. This run is unaffected (it uses the in-repo copy), but the owner's manual 'ship now' button runs the drifted code."
          {
            echo "### Runtime ios-fleet drift"
            echo
            echo "This ship used the in-repo copy and is unaffected. The manual"
            echo '`ship-now-gui.sh` path runs `/Users/jay/apps/ios-fleet/` and is not.'
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Ship CongressTrade to TestFlight
        if: steps.gate.outputs.should_ship == '1'
        env:
          IOS_TF_RELEASE_NOTES: "1"  # Jay 2026-09-08: publish ASC What to Test
        run: |
          # Wrapper resolves the in-repo fleet script (scripts/ios-fleet/) and
          # enforces the stable-Xcode rule; it falls back to the host copy only
          # if the repo copy is missing, and logs loudly when it does.
          bash "$GITHUB_WORKSPACE/scripts/ios-ship-testflight.sh"
