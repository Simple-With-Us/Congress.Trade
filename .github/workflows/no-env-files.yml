name: No env files

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-env-files:
    name: No env files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fail if an env or vars file is tracked
        env:
          ALLOW_RE: '^\.cursor/infisical\.env$'
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.env(\..+)?|[^/]*\.env|[^/]*\.vars(\..+)?)$' | grep -Ev '\.(example|sample|template|dist)$' | grep -Ev "$ALLOW_RE" || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked env or vars files are not allowed. All secrets live only in Infisical."
            echo "$bad"
            exit 1
          fi
