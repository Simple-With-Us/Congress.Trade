name: Coolify watch paths

# Race-free docs-only skip for congress.trade.  Coolify's GitHub webhook still
# auto-deploys, but only when the push touches app/** or services/**.
# This workflow keeps that setting applied and cancels a slipped deploy.
#
# Not a required check.  Missing COOLIFY_AGENTS is a no-op (forks / local).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: apply watch_paths
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Syntax-check ops helpers
        run: |
          bash -n scripts/ops/coolify-watch-paths.sh
          bash -n scripts/ops/test-deploy-relevance.sh
          python3 -m py_compile scripts/ops/deploy_relevance.py

      - name: Offline relevance tests
        run: bash scripts/ops/test-deploy-relevance.sh

      - name: Apply Coolify watch_paths
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_AGENTS }}
        run: |
          set -uo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "COOLIFY_AGENTS missing; skip live apply (watch_paths is the host setting)."
            exit 0
          fi
          if ! bash scripts/ops/coolify-watch-paths.sh; then
            echo "::warning::Could not PATCH Coolify from this runner (edge block or API drift). Offline tests passed; live watch_paths was already applied from the agent VM."
            exit 0
          fi

      - name: Cancel a docs-only deploy that already queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_AGENTS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "COOLIFY_AGENTS missing; cannot cancel."
            exit 0
          fi
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "no before sha; skip cancel decision."
            exit 0
          fi
          files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${before}...${after}" --jq '.files[].filename')"
          rc=0
          printf '%s\n' "$files" | python3 scripts/ops/deploy_relevance.py --from-stdin || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "push is deploy-relevant; leave Coolify queue alone."
            exit 0
          fi
          if [ "$rc" -ne 1 ]; then
            echo "relevance helper failed closed (rc=$rc); not cancelling."
            exit 0
          fi
          echo "docs/iOS/ops-only push; cancel queued congress-trade deploys."
          bash scripts/ops/coolify-watch-paths.sh --cancel-queued
