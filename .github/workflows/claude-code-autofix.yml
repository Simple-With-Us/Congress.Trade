name: Claude Code Autofix

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to run the autofix loop on"
        required: true

permissions:
  contents: write
  pull-requests: write

  issues: write
concurrency:
  group: pr-autofix-${{ github.repository }}-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: false

jobs:
  autofix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.type == 'Bot' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: Simple-With-Us/AI-Fleet-Coordinator/.github/workflows/claude-code-autofix-reusable.yml@c97a2dae96762eb9ffc122c753f0dfb0a7840650
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      META_MODEL_API_TOKEN: ${{ secrets.META_MODEL_API_TOKEN }}
      USAGE_INGEST_TOKEN: ${{ secrets.USAGE_INGEST_TOKEN }}
    with:
      # Pinned reusable SHAs can drift behind the owner ruling; pass the live id explicitly (2026-10-20: all fleet MiniMax use goes to MiniMax-M3.1-Flash).
      model: MiniMax-M3.1-Flash
      prompt: |
        You are the fleet's autofix bot.  A review bot (Codex, Kody, or Cursor) just reviewed this pull request.
        1. Read every unresolved review comment from that review.  For each, decide against the current code whether it is a real defect.
        2. Fix real defects with the smallest change that answers the comment.  Do not refactor unrelated code, rename things, or reformat files.
        3. Never edit files under .github/workflows, never add or print secrets, and never weaken a test to make it pass.
        4. Run this repo's verify command (below) and make sure it passes before committing.  If you cannot make it pass, commit nothing.
        5. Commit with a subject starting "autofix:" and push to the PR branch.  Stop after one round.
        6. If a comment is not a real defect or is unclear, change nothing for it.
        This repo's verify command: `cd app && npm run typecheck && npm test`.